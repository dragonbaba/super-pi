name: Evidence Ledger focused development
on:
  push:
    branches: [phase/6a1-evidence-ledger-core-read]
permissions:
  contents: read
jobs:
  focused-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.x
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:offline
      - run: node --experimental-strip-types --test tests/evidence-ledger-*.test.ts
      - name: Bounded performance evidence (explicit one-run marker)
        if: contains(github.event.head_commit.message, '[evidence-profile]')
        run: |
          node --experimental-strip-types scripts/bench/evidence-ledger.ts hit evidence-ledger-results
          node --experimental-strip-types scripts/bench/evidence-ledger.ts miss evidence-ledger-results
          node --experimental-strip-types scripts/bench/evidence-ledger.ts disabled evidence-ledger-results
          node --expose-gc --experimental-strip-types scripts/bench/evidence-ledger.ts profile evidence-ledger-results
          node --expose-gc --experimental-strip-types scripts/bench/evidence-ledger.ts gc evidence-ledger-results
      - uses: actions/upload-artifact@v4
        if: always() && contains(github.event.head_commit.message, '[evidence-profile]')
        with:
          name: evidence-ledger-results
          path: evidence-ledger-results
